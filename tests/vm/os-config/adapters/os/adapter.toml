name = "os"
run = "python3 /usr/local/lib/upkeep/adapters/ubuntu-os/ubuntu_os.py"

[actions.check_updates]
timeout = "10m"
[actions.update]
timeout = "60m"
[actions.verify]
timeout = "2m"
[actions.discover]
timeout = "2m"

[[service]]
name = "ssh"
kind = "systemd"
unit = "ssh.service"

[[service]]
name = "upkeep runner"
kind = "process"
pattern = "upkeep serve"

[[ping]]
name = "dns"
command = "getent hosts localhost"
