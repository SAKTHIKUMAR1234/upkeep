[package]
name = "upkeep-desktop"
version = "0.1.0"
edition = "2024"
description = "The Upkeep desktop window"
license = "MIT"

[[bin]]
name = "upkeep-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
upkeep = { path = ".." }

[build-dependencies]
tauri-build = { version = "2", features = [] }
