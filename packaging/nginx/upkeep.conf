# TLS proxy for the Upkeep website. Replace upkeep.example.com and the certificate paths.

server {
    listen 80;
    listen [::]:80;
    server_name upkeep.example.com;
    return 301 https://$host$request_uri;
}

server {
    # "listen ... http2" works on nginx 1.18 and later; newer releases only warn about it.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name upkeep.example.com;

    ssl_certificate /etc/letsencrypt/live/upkeep.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upkeep.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:upkeep:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host keeps the port of a public URL such as https://upkeep.example.com:8443; $host drops it.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replaces any X-Forwarded-For of the client: the service reads the client address from it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:7890;
        proxy_read_timeout 150s;
    }

    # Server-sent events: no buffering, and a long read time between events.
    location ~ ^/api/(events|runs/[0-9]+/events)$ {
        proxy_pass http://127.0.0.1:7890;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
