# Failed sign-ins of the Upkeep website. Install as /etc/fail2ban/filter.d/upkeep.conf.
# The service logs an IPv4 address, or the /64 network of an IPv6 address; <SUBNET> bans either.

[Definition]
failregex = upkeep: failed sign-in from <SUBNET> for "
ignoreregex =
journalmatch = _SYSTEMD_UNIT=upkeep-app.service
