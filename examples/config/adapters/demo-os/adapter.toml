name = "demo-os"
run = "sh adapter.sh"
display_name = "Demo server"   # the name in messages when two adapters run the same step
writes_data = false

[actions.snapshot]
timeout = "5m"
[actions.upload]
title = "Uploading the snapshot"   # the step name in messages
timeout = "30m"
needs = ["snapshot"]
[actions.update]
timeout = "60m"
needs = ["snapshot"]
[actions.restore]
timeout = "30m"
[actions.verify]
timeout = "1m"

[[service]]
name = "upkeep runner"
kind = "process"
pattern = "upkeep.* serve"
