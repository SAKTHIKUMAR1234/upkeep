# TCP API with bearer token from /etc/upkeep/token (chmod 600). Off when not set.
# listen = "100.64.0.22:7878"

reboot_command = ["systemctl", "reboot"]

# auto: systemd-run when root under systemd, else setsid.
launcher = "auto"

# Monitor: checks run inside `upkeep serve`. Changes apply on the next round, no restart needed.
# Check kinds: services (adapter services and pings), disk, inodes, memory, swap, load,
# failed-units, reboot-required, security-updates, snapshot-age; and peer:<name>.
# [monitor]
# display_name = "Replica server (.11)"  # name in messages; the host name when absent
# interval = "60s"
# alert_after = 2            # rounds in a row before a new state is announced
# repeat_every = "6h"        # send a still-bad check again after this time
# utc_offset = "+05:30"      # local time for quiet hours, the digest and message times
# quiet_hours = "22:00-07:00" # warn waits; critical always sends
# digest_at = "09:00"        # daily summary of this server and its peers; set it on one server only
# disable = ["security-updates"]
# job_grace = "5m"           # no alerts for this server while a job runs and this long after it ends
# ignore_failed_units = ["systemd-networkd-wait-online.service"]  # failed-units skips these; * and ? match like the shell
# disk_mounts = []           # empty: every mounted disk file system
# disk = { warn = 80, critical = 90 }
# inodes = { warn = 80, critical = 90 }
# memory = { warn = 90, critical = 95 }
# swap = { warn = 50, critical = 80 }
# load = { warn = 2.0, critical = 4.0 }   # 5-minute load average per CPU
# snapshot_max_age = "26h"   # warn above it, critical at twice it
#
# [monitor.telegram]
# token_file = "/etc/upkeep/telegram-token"   # chmod 600
# chat_id = "-1001234567890"
# message_thread_id = 12     # topic id, for a group with topics
#
# [[monitor.peer]]           # another runner this one watches; "runner down" when it stops answering
# name = "erp"
# display_name = "ERP server (.22)"
# url = "http://100.64.0.22:7878"
# token_file = "/etc/upkeep/peers/erp.token"  # that runner's API token, chmod 600
# down_after = "10m"         # alert only when it has not answered this long, so a reboot does not alert
