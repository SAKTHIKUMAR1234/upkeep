name = "os"
run = "python3 /usr/local/lib/upkeep/adapters/ubuntu-os/ubuntu_os.py"
writes_data = false

[actions.check_updates]
timeout = "10m"
[actions.update]
timeout = "90m"
[actions.verify]
timeout = "2m"
[actions.discover]
timeout = "2m"
[actions.snapshot]
timeout = "4h"
[actions.retention]
timeout = "2h"
[actions.restore]
timeout = "4h"

[[service]]
name = "ssh"
kind = "systemd"
unit = "ssh.service"

[[service]]
name = "mariadb"
kind = "systemd"
unit = "mariadb.service"

[[ping]]
name = "mariadb answers"
command = "mariadb-admin ping --silent"
